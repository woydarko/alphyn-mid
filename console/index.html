<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    />
    <title>Alphyn — Private AI vault on Midnight</title>
    <script>
      // Shim Node globals some Midnight deps reference at module load. This must
      // run before the module graph evaluates, so it lives here as a classic
      // (non-deferred) script rather than inside main.tsx.
      window.global = window.global || window.globalThis;
      window.process = window.process || {
        env: {},
        browser: true,
        version: '',
        versions: {},
        platform: 'browser',
        nextTick: function (cb) { setTimeout(cb, 0); },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
