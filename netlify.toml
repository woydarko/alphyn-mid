# Netlify config — deploys the console dApp (the full wallet-driven app).
# The hosted build is fully functional on Preprod: connect 1AM, mint, deposit
# (which runs an epoch), withdraw, and read the leaderboard all happen on-chain
# through the wallet's hosted proving (1AM Proofstation) — no bridge, no local
# proof server. It reads proof-server + indexer endpoints from the connected
# wallet, so no VITE_* overrides are set here. Serves at root ('/').
[build]
  command = "cd console && npm install --legacy-peer-deps && npx vite build --base=/"
  publish = "console/dist"

[build.environment]
  NODE_VERSION = "22"

# HashRouter serves every route from index.html; keep an SPA fallback anyway.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
